name: full-stack-tests
channels:
  - openeye
  - conda-forge
dependencies:
  - python
  - setuptools
  - uv
  - numpy
  - pydantic
  - pint
  - openff-toolkit >=0.18
  - openff-nagl >=0.5
  - openff-fragmenter
  - openff-units >=0.4
  - mdtraj
  - pymbar
  - pytest
  - pytest-randomly
  - pytest-xdist
